stories:
  - name: "Full app dark mode consistency"
    url: "http://localhost:5173/"
    workflow: |
      Navigate to http://localhost:5173/
      Log in with test@test.com (wait for auto-login to complete)
      Toggle dark mode on
      Navigate through all pages: journal, analytics/insights
      Verify every page has consistent dark mode styling (no white flashes, no unstyled sections)
      Verify the sidebar is dark-themed
      Verify the header is dark-themed with frosted glass still visible
      Verify entry cards, mood selectors, and tag chips all respect dark mode
      Toggle dark mode off
      Verify everything returns to the warm parchment light theme

  - name: "Responsive layout transition between mobile and desktop"
    url: "http://localhost:5173/"
    workflow: |
      Navigate to http://localhost:5173/
      Log in with test@test.com (wait for auto-login to complete)
      Start at desktop width (1200px+)
      Verify sidebar is visible, header offset from sidebar, content flows normally
      Gradually resize the browser window to mobile width (below 768px)
      Verify the sidebar disappears smoothly
      Verify the header expands to full width
      Verify the menu toggle icon appears
      Verify no layout shift or content overlap during the transition

  - name: "No layout shift or content overlap"
    url: "http://localhost:5173/"
    workflow: |
      Navigate to http://localhost:5173/
      Log in with test@test.com (wait for auto-login to complete)
      Verify the main content area does NOT overlap with the sidebar on desktop
      Verify the main content area does NOT overlap with the header (content starts below header)
      Scroll the main content
      Verify content scrolls under the fixed header without clipping
      Verify the sidebar remains fixed while content scrolls

  - name: "Theme persists across page navigation"
    url: "http://localhost:5173/"
    workflow: |
      Navigate to http://localhost:5173/
      Log in with test@test.com (wait for auto-login to complete)
      Toggle dark mode on
      Navigate to the analytics/insights page
      Verify dark mode is still active
      Navigate back to journal
      Verify dark mode is still active
      Refresh the page
      Verify dark mode persists after refresh (no flash of light mode)

  - name: "Entry creation flow with new design"
    url: "http://localhost:5173/"
    workflow: |
      Navigate to http://localhost:5173/
      Log in with test@test.com (wait for auto-login to complete)
      Click the button to create a new journal entry
      Verify the mood selector displays with rounded cards and warm styling
      Select a mood
      Verify tag chips display with pill shapes
      Select one or more tags
      Write some notes in the text area
      Submit the entry
      Verify the AI response streaming animation plays with sage-themed colors
      Verify the new entry appears in the timeline with correct mood-colored left border
      Verify the entry card shows pill-shaped tags
